{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}{{ title }} — {{ company.name }}{% endblock %}

{% block content %}
<nav aria-label="breadcrumb" class="mb-3">
  <ol class="breadcrumb">
    <li class="breadcrumb-item"><a href="{% url 'setup:company_list' %}">Companies</a></li>
    <li class="breadcrumb-item"><a href="{% url 'setup:company_detail' company.pk %}">{{ company.name }}</a></li>
    <li class="breadcrumb-item active">{{ title }}</li>
  </ol>
</nav>

<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card">
      <div class="card-header fw-semibold">{{ title }}</div>
      <div class="card-body">
        <form method="post">
          {% csrf_token %}
          {{ form|crispy }}
          <div class="d-flex gap-2 mt-3">
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="{% url 'setup:company_detail' company.pk %}" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
