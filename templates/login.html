<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – LightUpNet</title>
  {% load static %}
  <link rel="icon" type="image/svg+xml" href="{% static 'img/favicon.svg' %}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="{% static 'css/main.css' %}" rel="stylesheet" />
</head>
<body>

<div class="login-wrapper">
  <div class="login-card">

    <!-- Logo -->
    <div class="login-logo">
      <div class="brand-icon">⚡</div>
      <div>
        <div class="brand-name">LightUpNet</div>
        <div class="brand-sub">Carrier Management Portal</div>
      </div>
    </div>

    <div class="accent-line"></div>

    {% if form.errors %}
    <div class="alert alert-danger py-2 small mb-3">
      <i class="bi bi-exclamation-triangle-fill me-1"></i> Invalid username or password.
    </div>
    {% endif %}

    <form method="post">
      {% csrf_token %}

      <div class="mb-3">
        <label class="form-label">Username</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person"></i></span>
          <input name="username" type="text" class="form-control" autofocus required placeholder="Enter username" />
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label">Password</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input name="password" type="password" class="form-control" required placeholder="Enter password" />
        </div>
      </div>

      <input type="hidden" name="next" value="{{ next }}" />

      <button type="submit" class="btn btn-primary w-100 py-2" style="font-size:0.9rem; letter-spacing:0.05em">
        <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
      </button>
    </form>

    <p class="text-center mt-4 mb-0" style="font-size:0.72rem; color:var(--text-muted)">
      &copy; {{ "now"|date:"Y" }} LightUpNet &mdash; Secure Access
    </p>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
